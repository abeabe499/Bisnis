<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Growth Mentor</title>
<meta name="theme-color" content="#050816">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Growth Mentor">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#050816;color:#eef2ff;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050816}
#load,#setup{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box}
#load img,#setup img{width:96px;height:96px;border-radius:24px}
a{color:#a5f3fc}
input{width:100%;max-width:420px;padding:12px;border-radius:12px;border:1px solid #475569;background:#0b1030;color:#fff;font-size:15px;box-sizing:border-box}
button{margin-top:12px;padding:12px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,#6366f1,#22d3ee);color:#fff;font-weight:700;font-size:15px}
.err{color:#fca5a5;font-size:13px;min-height:18px}
</style>
</head>
<body>

<div id="setup" hidden>
  <div>
    <img src="icon-192.png" alt="Robot Biru">
    <h2>Halo, aku Biru!</h2>
    <p>Tempel URL Web App Apps Script-mu sekali saja (yang berakhiran <b>/exec</b>).</p>
    <input id="u" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url" autocomplete="off">
    <div class="err" id="e"></div>
    <button onclick="save()">Simpan &amp; Buka</button>
  </div>
</div>

<div id="load">
  <div>
    <img src="icon-192.png" alt="Robot Biru">
    <p>Membuka Growth Mentor…</p>
    <p style="font-size:13px;opacity:.8">Tidak terbuka? <a id="direct" href="#">Buka langsung</a> · <a href="#" onclick="resetUrl();return false">Ganti URL</a></p>
  </div>
</div>
<iframe id="app" title="Growth Mentor" allow="clipboard-write" hidden></iframe>

<script>
/* Jika kamu sudah punya URL-nya, boleh ditulis di sini. Kalau dibiarkan kosong, aplikasi akan memintanya sekali saat pertama dibuka. */
var APP_URL = "";

var KEY = 'gm_app_url';
function stored(){ try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; } }
function valid(u){ return /^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(u); }
function start(u){
  document.getElementById('setup').hidden = true;
  document.getElementById('load').hidden = false;
  document.getElementById('direct').href = u;
  var f = document.getElementById('app'); f.hidden = false; f.src = u;
}
function save(){
  var u = document.getElementById('u').value.trim();
  if(!valid(u)){ document.getElementById('e').textContent = 'URL belum benar. Harus diawali https://script.google.com/macros/s/ dan berakhiran /exec'; return; }
  try { localStorage.setItem(KEY, u); } catch(e){}
  start(u);
}
function resetUrl(){ try { localStorage.removeItem(KEY); } catch(e){} location.reload(); }

var u0 = APP_URL || stored();
if (valid(u0)) start(u0);
else { document.getElementById('load').hidden = true; document.getElementById('setup').hidden = false; }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
